<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="ForgeFit: aplicación de entrenamiento de fuerza e hipertrofia con seguimiento de series, progresión de cargas, PRs y programa de 8 semanas." />
  <meta name="theme-color" content="#0b0d10" />
  <title>ForgeFit — Fuerza + Hipertrofia</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icons/icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Navegación principal"></aside>
    <div class="main-col">
      <div id="resume-banner" class="resume-banner" hidden></div>
      <main id="app-content" class="app-content" tabindex="-1" aria-live="polite"></main>
    </div>
    <nav id="bottom-nav" class="bottom-nav" aria-label="Navegación móvil"></nav>
  </div>

  <div id="rest-timer-widget" class="rest-timer-widget" hidden aria-live="polite"></div>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <div id="modal-root" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
